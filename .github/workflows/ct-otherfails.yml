name: ct-otherfails
on:
  push:
    branches: ["ci-ct-*"]
permissions:
  contents: read
jobs:
  test-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: shorten the macOS runner hostname (kube-apiserver identity lease label, 63 bytes)
        if: runner.os == 'macOS'
        run: |
          hostname | awk '{print "hostname bytes before:", length($0)}'
          sudo scutil --set HostName ctci
          sudo hostname ctci
          hostname | awk '{print "hostname bytes after:", length($0)}'
      - name: upstream test.sh (lint + go test -race in every module)
        run: TRACE=1 ./test.sh
  windows-go-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test ./... (root module)
        run: go test -count=1 ./...
