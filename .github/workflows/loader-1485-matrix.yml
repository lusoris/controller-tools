name: loader-1485-matrix
on:
  push:
    branches: [ci-1485-matrix-mutant]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: loader tests
        run: go test -count=1 -v ./pkg/loader/...
