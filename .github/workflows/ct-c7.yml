name: ct-c7
on:
  push:
    branches: ["ci-ct-c7-*"]
permissions:
  contents: read
jobs:
  applyconfiguration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test ./pkg/applyconfiguration/...
        run: go test -count=1 -v ./pkg/applyconfiguration/...
